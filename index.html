<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🔔 منبه لا ينطفئ + عداد المسافة الإجمالية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif; }
        body { background: linear-gradient(145deg, #1a2f3a, #0a1f2a); padding: 20px; color: white; min-height: 100vh; }
        .container { max-width: 800px; margin: auto; background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); border-radius: 48px; padding: 25px; border: 1px solid #ffcc88; }
        h1 { text-align: center; color: #ffdd99; margin-bottom: 15px; }
        .section { background: #1e2a32aa; border-radius: 40px; padding: 15px; margin-bottom: 20px; }
        .flex-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin: 10px 0; }
        label { min-width: 120px; font-weight: bold; }
        input, select, button { padding: 8px 15px; border-radius: 40px; border: none; background: #2c3e2f; color: white; font-size: 0.9rem; }
        button { background: #e67e22; cursor: pointer; transition: 0.1s; }
        button:active { transform: scale(0.96); }
        .status { background: #00000066; border-radius: 40px; padding: 10px; text-align: center; margin: 15px 0; font-size: 0.9rem; }
        .math-quiz, .run-tracker { background: #0a1522aa; border-radius: 30px; padding: 15px; margin-top: 10px; display: none; }
        .question { font-size: 1.5rem; text-align: center; margin: 15px 0; direction: ltr; }
        .distance-display { font-size: 1.2rem; text-align: center; margin: 10px 0; background: #00000044; border-radius: 30px; padding: 8px; }
        .total-distance { background: #2a7a4a; display: inline-block; padding: 4px 15px; border-radius: 30px; margin-bottom: 10px; }
        @media (max-width: 600px) { .flex-row { flex-direction: column; align-items: stretch; } label { min-width: auto; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🔔 منبه لا ينطفئ + عداد المسافة</h1>
    <div class="status" id="statusMsg">⚙️ اضبط الوقت. سيصدر صوتاً حتى مع قفل الشاشة (أبقِ المتصفح مفتوحاً).</div>

    <div class="section">
        <div class="flex-row">
            <label>⏰ وقت التنبيه:</label>
            <input type="datetime-local" id="alarmTime" step="1">
        </div>
        <div class="flex-row">
            <label>🎯 نوع التحدي:</label>
            <select id="taskType">
                <option value="math">🧮 مسائل رياضية</option>
                <option value="run">🏃‍♂️ جري (مسافة)</option>
            </select>
        </div>
        <div class="flex-row">
            <button id="setAlarmBtn">✅ ضبط المنبه</button>
            <button id="requestPermBtn">🔔 طلب أذونات (إشعارات/صوت)</button>
        </div>
    </div>

    <div id="mathSettings" class="section">
        <div class="flex-row"><label>صعوبة المسائل:</label><select id="mathDifficulty"><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select></div>
        <div class="flex-row"><label>عدد المسائل:</label><input type="number" id="numQuestions" min="1" max="20" value="3"></div>
    </div>

    <div id="runSettings" class="section" style="display:none;">
        <div class="flex-row"><label>المسافة المطلوبة (متر):</label><input type="number" id="runDistance" min="10" value="100" step="10"></div>
        <div class="flex-row"><button id="requestGpsBtn">📍 طلب إذن GPS</button></div>
    </div>

    <!-- قسم النغمة -->
    <div class="section">
        <div class="flex-row"><label>🎵 نغمة التنبيه:</label>
            <input type="file" id="ringtoneFile" accept="audio/*">
            <button id="testRingtoneBtn">▶️ تجربة</button>
            <button id="resetRingtoneBtn">🔊 نغمة افتراضية</button>
        </div>
    </div>

    <div id="mathQuizPanel" class="math-quiz">
        <div class="section-title">🧠 حل المسائل (إجباري)</div>
        <div id="quizQuestion" class="question"></div>
        <input type="number" id="quizAnswer" placeholder="إجابتك">
        <button id="submitAnswerBtn">تأكيد</button>
        <div id="quizStatus" class="status"></div>
    </div>

    <div id="runPanel" class="run-tracker">
        <div class="section-title">🏁 اجتياز المسافة</div>
        <div class="total-distance">🏆 إجمالي ما ركضته: <span id="totalRunDistanceSpan">0</span> متر</div>
        <div class="distance-display">📏 المسافة المقطوعة الآن: <span id="currentDistance">0</span> متر</div>
        <div class="distance-display">🎯 المسافة المطلوبة للتحدي: <span id="targetDistanceSpan">0</span> متر</div>
        <button id="startRunBtn">▶️ بدء التتبع (GPS)</button>
        <button id="stopRunBtn" style="display:none;">⏹️ إيقاف</button>
        <div id="gpsStatus"></div>
        <div class="flex-row"><label>أو أدخل مسافة يدوياً:</label><input type="number" id="manualDistance" placeholder="أمتار"><button id="addManualBtn">➕ إضافة (وتضاف للإجمالي)</button></div>
    </div>
</div>

<script>
    // ---------- الحالة العامة ----------
    let alarmTriggered = false;
    let alarmTimeout = null;
    let challengeActive = false;
    let currentTask = 'math';
    let mathQuestions = [], currentQIndex = 0;
    let targetDistance = 100, walkedDistance = 0;
    let watchId = null, lastLat = null, lastLon = null, tracking = false;
    let audioCtx = null, soundInterval = null;
    let notificationsGranted = false;
    let selectedAudio = null;          // النغمة المختارة (Audio object)
    let currentRingtoneUrl = null;     // رابط النغمة الحالية
    let totalRunDistance = 0;          // إجمالي المسافة المقطوعة عبر كل التحديات

    // عناصر DOM
    const alarmTimeInput = document.getElementById('alarmTime');
    const taskTypeSelect = document.getElementById('taskType');
    const mathDifficulty = document.getElementById('mathDifficulty');
    const numQuestions = document.getElementById('numQuestions');
    const runDistance = document.getElementById('runDistance');
    const setAlarmBtn = document.getElementById('setAlarmBtn');
    const requestPermBtn = document.getElementById('requestPermBtn');
    const statusMsgSpan = document.getElementById('statusMsg');
    const mathQuizPanel = document.getElementById('mathQuizPanel');
    const runPanel = document.getElementById('runPanel');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizAnswer = document.getElementById('quizAnswer');
    const submitAnswer = document.getElementById('submitAnswerBtn');
    const quizStatus = document.getElementById('quizStatus');
    const currentDistanceSpan = document.getElementById('currentDistance');
    const targetDistanceSpan = document.getElementById('targetDistanceSpan');
    const startRunBtn = document.getElementById('startRunBtn');
    const stopRunBtn = document.getElementById('stopRunBtn');
    const gpsStatusDiv = document.getElementById('gpsStatus');
    const manualDistance = document.getElementById('manualDistance');
    const addManualBtn = document.getElementById('addManualBtn');
    const requestGpsBtn = document.getElementById('requestGpsBtn');
    const ringtoneFile = document.getElementById('ringtoneFile');
    const testRingtoneBtn = document.getElementById('testRingtoneBtn');
    const resetRingtoneBtn = document.getElementById('resetRingtoneBtn');
    const totalRunDistanceSpan = document.getElementById('totalRunDistanceSpan');

    // ---------- إدارة النغمة ----------
    function saveRingtoneToStorage() {
        if (currentRingtoneUrl && currentRingtoneUrl.startsWith('blob:')) {
            localStorage.setItem('ringtone_blob', currentRingtoneUrl);
        } else {
            localStorage.removeItem('ringtone_blob');
        }
    }

    function loadRingtoneFromStorage() {
        const stored = localStorage.getItem('ringtone_blob');
        if (stored && stored.startsWith('blob:')) {
            currentRingtoneUrl = stored;
            selectedAudio = new Audio(currentRingtoneUrl);
            selectedAudio.loop = true;
            statusMsgSpan.innerHTML += '<br>🎵 تم استعادة النغمة المخصصة';
        }
    }

    ringtoneFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('audio/')) {
            if (currentRingtoneUrl && currentRingtoneUrl.startsWith('blob:')) URL.revokeObjectURL(currentRingtoneUrl);
            const url = URL.createObjectURL(file);
            currentRingtoneUrl = url;
            selectedAudio = new Audio(url);
            selectedAudio.loop = true;
            saveRingtoneToStorage();
            statusMsgSpan.innerHTML += '<br>✅ تم اختيار نغمة جديدة. اضغط "تجربة" لسماعها.';
        } else {
            alert('يرجى اختيار ملف صوتي صالح (MP3, WAV, OGG)');
        }
    });

    testRingtoneBtn.addEventListener('click', () => {
        if (selectedAudio) {
            selectedAudio.play().catch(e => console.log('test play error', e));
            setTimeout(() => { if (selectedAudio) selectedAudio.pause(); }, 3000);
        } else {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 880;
            osc.type = 'sawtooth';
            gain.gain.value = 0.3;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 2);
            ctx.resume();
            setTimeout(() => ctx.close(), 2000);
        }
    });

    resetRingtoneBtn.addEventListener('click', () => {
        if (currentRingtoneUrl && currentRingtoneUrl.startsWith('blob:')) URL.revokeObjectURL(currentRingtoneUrl);
        currentRingtoneUrl = null;
        selectedAudio = null;
        localStorage.removeItem('ringtone_blob');
        statusMsgSpan.innerHTML += '<br>🔊 تم تفعيل النغمة الافتراضية الحادة';
    });

    // ---------- تشغيل صوت التنبيه ----------
    function playAlarmSound() {
        if (!challengeActive) return;
        if (selectedAudio) {
            selectedAudio.loop = true;
            selectedAudio.play().catch(e => console.log('audio play error', e));
        } else {
            if (audioCtx) audioCtx.close().catch(()=>{});
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            osc.type = 'sawtooth';
            gain.gain.value = 0.4;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
            osc.onended = () => { if (challengeActive) playAlarmSound(); };
            audioCtx.resume();
        }
        if (soundInterval) clearInterval(soundInterval);
        soundInterval = setInterval(() => {
            if (challengeActive) {
                if (selectedAudio && (selectedAudio.paused || selectedAudio.ended)) {
                    selectedAudio.play().catch(e=>{});
                } else if (!selectedAudio && (!audioCtx || audioCtx.state !== 'running')) {
                    playAlarmSound();
                }
            }
        }, 2000);
    }

    function stopAlarmSound() {
        if (selectedAudio) {
            selectedAudio.pause();
            selectedAudio.currentTime = 0;
        }
        if (audioCtx) audioCtx.close();
        if (soundInterval) clearInterval(soundInterval);
        audioCtx = null;
    }

    // ---------- إدارة عداد المسافة الإجمالي ----------
    function loadTotalDistance() {
        const saved = localStorage.getItem('total_run_distance');
        if (saved && !isNaN(parseFloat(saved))) {
            totalRunDistance = parseFloat(saved);
        } else {
            totalRunDistance = 0;
        }
        totalRunDistanceSpan.innerText = Math.round(totalRunDistance);
    }

    function saveTotalDistance() {
        localStorage.setItem('total_run_distance', totalRunDistance);
        totalRunDistanceSpan.innerText = Math.round(totalRunDistance);
    }

    function addToTotalDistance(amount) {
        if (amount > 0) {
            totalRunDistance += amount;
            saveTotalDistance();
        }
    }

    // ---------- دوال التحدي ----------
    async function requestPermissions() {
        const notif = await Notification.requestPermission();
        notificationsGranted = (notif === 'granted');
        if (notificationsGranted) statusMsgSpan.innerHTML += '<br>✅ الإشعارات مفعلة';
        else statusMsgSpan.innerHTML += '<br>⚠️ الإشعارات غير مفعلة';
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            await ctx.resume();
            ctx.close();
            statusMsgSpan.innerHTML += '<br>✅ الصوت مفعل';
        } catch(e) { statusMsgSpan.innerHTML += '<br>⚠️ فشل تفعيل الصوت تلقائياً'; }
    }
    requestPermBtn.addEventListener('click', requestPermissions);
    requestPermissions();

    function generateQuestions(count, diff) {
        let max = diff === 'easy' ? 20 : (diff === 'medium' ? 100 : 1000);
        let q = [];
        for (let i = 0; i < count; i++) {
            let a = Math.floor(Math.random() * (max+1));
            let b = Math.floor(Math.random() * (max+1));
            let op = Math.random() > 0.5 ? '+' : '-';
            let ans = op === '+' ? a+b : a-b;
            q.push({ text: `${a} ${op} ${b} = ?`, answer: ans });
        }
        return q;
    }

    function startMathChallenge() {
        mathQuestions = generateQuestions(parseInt(numQuestions.value), mathDifficulty.value);
        currentQIndex = 0;
        mathQuizPanel.style.display = 'block';
        runPanel.style.display = 'none';
        showNextQuestion();
        challengeActive = true;
        playAlarmSound();
    }

    function showNextQuestion() {
        if (currentQIndex < mathQuestions.length) {
            quizQuestion.innerText = mathQuestions[currentQIndex].text;
            quizAnswer.value = '';
            quizStatus.innerText = `سؤال ${currentQIndex+1}/${mathQuestions.length}`;
        } else { completeChallenge(); }
    }

    function checkAnswer() {
        let user = parseFloat(quizAnswer.value);
        if (isNaN(user)) { quizStatus.innerText = '❌ أدخل رقماً'; return; }
        if (user === mathQuestions[currentQIndex].answer) {
            currentQIndex++;
            if (currentQIndex < mathQuestions.length) {
                quizStatus.innerText = '✅ صحيح! انتقل إلى التالي';
                showNextQuestion();
            } else {
                quizStatus.innerText = '🎉 تهانينا! أكملت المسائل.';
                completeChallenge();
            }
        } else { quizStatus.innerText = '❌ إجابة خاطئة، حاول مرة أخرى'; }
    }

    function distanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updatePosition(pos) {
        if (!tracking) return;
        let lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (lastLat !== null && lastLon !== null) {
            let dist = distanceMeters(lastLat, lastLon, lat, lon);
            walkedDistance += dist;
            currentDistanceSpan.innerText = Math.round(walkedDistance);
            if (walkedDistance >= targetDistance) {
                gpsStatusDiv.innerText = '✅ تم قطع المسافة المطلوبة!';
                addToTotalDistance(walkedDistance);   // أضف المسافة التي قطعها في هذا التحدي إلى الإجمالي
                stopTracking();
                completeChallenge();
            } else { gpsStatusDiv.innerText = `🚶 قطعت ${Math.round(walkedDistance)} م من ${targetDistance} م`; }
        }
        lastLat = lat; lastLon = lon;
    }

    function startTracking() {
        if (!navigator.geolocation) { alert('GPS غير مدعوم'); return; }
        walkedDistance = 0;
        lastLat = lastLon = null;
        tracking = true;
        startRunBtn.style.display = 'none';
        stopRunBtn.style.display = 'inline-block';
        gpsStatusDiv.innerText = '⏳ تتبع نشط، تحرك لاحتساب المسافة';
        watchId = navigator.geolocation.watchPosition(updatePosition, (err) => { gpsStatusDiv.innerText = `خطأ GPS: ${err.message}`; }, { enableHighAccuracy: true });
    }

    function stopTracking() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        tracking = false;
        startRunBtn.style.display = 'inline-block';
        stopRunBtn.style.display = 'none';
    }

    function addManual() {
        let add = parseFloat(manualDistance.value);
        if (isNaN(add) || add <= 0) { gpsStatusDiv.innerText = '⚠️ أدخل مسافة صحيحة'; return; }
        walkedDistance += add;
        currentDistanceSpan.innerText = Math.round(walkedDistance);
        if (walkedDistance >= targetDistance) {
            gpsStatusDiv.innerText = `✅ بإضافة ${add} متر، تم تحقيق الهدف!`;
            addToTotalDistance(walkedDistance);
            completeChallenge();
        } else { gpsStatusDiv.innerText = `➕ أضفت ${add} متر، المجموع ${Math.round(walkedDistance)} متر`; }
        manualDistance.value = '';
    }

    function startRunChallenge() {
        targetDistance = parseFloat(runDistance.value) || 100;
        walkedDistance = 0;
        targetDistanceSpan.innerText = targetDistance;
        currentDistanceSpan.innerText = '0';
        runPanel.style.display = 'block';
        mathQuizPanel.style.display = 'none';
        challengeActive = true;
        playAlarmSound();
        if (tracking) stopTracking();
        gpsStatusDiv.innerText = 'اضغط "بدء التتبع" واستخدم GPS أو أدخل مسافة يدوياً';
    }

    function completeChallenge() {
        if (!challengeActive) return;
        challengeActive = false;
        stopAlarmSound();
        if (tracking) stopTracking();
        statusMsgSpan.innerHTML = '✅✅✅ تم إيقاف المنبه! ✅✅✅';
        mathQuizPanel.style.display = 'none';
        runPanel.style.display = 'none';
        localStorage.removeItem('alarm_pending');
        clearTimeout(alarmTimeout);
        alarmTriggered = false;
    }

    function sendNotification() {
        if (!notificationsGranted) return;
        new Notification('🔔 المنبه يدق! 🔔', { body: 'افتح التطبيق وأكمل التحدي لإيقاف الصوت.', requireInteraction: true });
    }

    function triggerAlarm() {
        if (alarmTriggered) return;
        alarmTriggered = true;
        statusMsgSpan.innerHTML = '🔔🔔🔔 المنبه يدق! أكمل التحدي لإيقافه 🔔🔔🔔';
        sendNotification();
        currentTask = taskTypeSelect.value;
        if (currentTask === 'math') startMathChallenge();
        else startRunChallenge();
        localStorage.setItem('alarm_pending', JSON.stringify({ task: currentTask, active: true }));
    }

    function scheduleAlarm() {
        if (alarmTimeout) clearTimeout(alarmTimeout);
        let alarmDate = new Date(alarmTimeInput.value);
        if (isNaN(alarmDate.getTime())) { statusMsgSpan.innerHTML = '⚠️ حدد وقتاً صحيحاً'; return; }
        let now = new Date();
        if (alarmDate <= now) { statusMsgSpan.innerHTML = '⚠️ الوقت المحدد مضى، اختر وقتاً مستقبلياً'; return; }
        let delay = alarmDate - now;
        alarmTimeout = setTimeout(triggerAlarm, delay);
        statusMsgSpan.innerHTML = `⏰ تم ضبط المنبه على ${alarmDate.toLocaleString()}. (أبقِ المتصفح مفتوحاً، يمكنك قفل الشاشة)`;
        localStorage.setItem('scheduled_alarm', alarmDate.toISOString());
    }

    function restorePendingAlarm() {
        let pending = localStorage.getItem('alarm_pending');
        if (pending) {
            let data = JSON.parse(pending);
            if (data.active === true) triggerAlarm();
        }
    }

    setAlarmBtn.addEventListener('click', scheduleAlarm);
    submitAnswer.addEventListener('click', checkAnswer);
    startRunBtn.addEventListener('click', startTracking);
    stopRunBtn.addEventListener('click', stopTracking);
    addManualBtn.addEventListener('click', addManual);
    requestGpsBtn.addEventListener('click', () => { if(navigator.geolocation) navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}); });
    taskTypeSelect.addEventListener('change', () => {
        const v = taskTypeSelect.value;
        document.getElementById('mathSettings').style.display = v === 'math' ? 'block' : 'none';
        document.getElementById('runSettings').style.display = v === 'run' ? 'block' : 'none';
    });
    taskTypeSelect.dispatchEvent(new Event('change'));

    loadRingtoneFromStorage();
    loadTotalDistance();
    restorePendingAlarm();
</script>
</body>
</html>
